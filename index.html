<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>FleetPulse - CarHub-Iloilo Liquidation</title><style>
:root{--bg:#050914;--s:#0b0f17f5;--m:#94a3b8;--t:#f8fafc;--p:#00b4d8;--g:#10b981;--r:#ef4444;--b:#33415599}*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;height:100dvh;background:var(--bg);color:var(--t);overflow:hidden;background-image:radial-gradient(ellipse at top,#00b4d82e,transparent 60%),linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:100% 100%,30px 30px,30px 30px}.app{max-width:550px;height:100%;margin:auto;display:flex;flex-direction:column}header{padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);background:#050914dd;backdrop-filter:blur(14px)}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border:1px solid #00b4d866;border-radius:10px;display:grid;place-items:center;color:var(--p);box-shadow:0 0 14px #00b4d855}.title{font-weight:900;letter-spacing:.8px;text-transform:uppercase}.title span{color:var(--p)}.powered{font-size:10px;color:var(--m)}button{cursor:pointer}.summary{border:0;border-radius:25px;padding:10px 14px;background:linear-gradient(135deg,#0077b6,var(--p));color:#fff;font-weight:900}.nav{padding:10px 20px;background:#050914b3}.tabs{display:flex;padding:4px;background:var(--s);border:1px solid var(--b);border-radius:12px}.tab{flex:1;border:0;background:none;color:var(--m);padding:9px 3px;border-radius:8px;font-weight:800}.tab.active{background:linear-gradient(135deg,#0077b6,var(--p));color:#fff}.tab.i.active{background:var(--g)}.tab.e.active{background:var(--r)}.view{display:none;flex:1;overflow:auto;padding:5px 20px 20px}.view.active{display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:11px;font-weight:700;margin-bottom:6px;text-transform:uppercase}input,select{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;background:var(--s);color:var(--t);font-size:16px}input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 2px #00b4d859}.btn{width:100%;padding:15px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:800}.green{background:var(--g)}.red{background:var(--r)}.gray{background:#64748b}.toolbar{display:flex;gap:5px;margin-bottom:10px}.toolbar input{flex:1.4;padding:8px}.toolbar select{flex:1;padding:8px;font-size:12px}.print{width:100%;padding:11px;border:1px solid #00b4d866;border-radius:8px;background:var(--s);color:var(--p);font-weight:800}.card{display:flex;gap:10px;padding:12px;margin:9px 0 0;background:var(--s);border:1px solid var(--b);border-left:4px solid var(--p);border-radius:12px}.icon{width:40px;height:40px;border-radius:10px;background:#00b4d81f;display:grid;place-items:center;flex:none}.info{flex:1;min-width:0}.ct{font-weight:800;font-size:14px}.ref,.sub,.bal{font-size:10px;color:var(--m)}.amt{text-align:right;font-weight:800}.pos{color:var(--g)}.neg{color:var(--r)}.acts{text-align:right}.mini{background:none;border:0;font-size:13px}.footer{display:flex;justify-content:space-between;padding:12px 0}.link{background:none;border:0;color:var(--p);font-size:11px;font-weight:700}.danger{color:var(--r)}.overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.modal,.sheet{width:100%;max-width:450px;background:var(--s);border:1px solid var(--p);border-radius:24px;padding:24px}.sheet{align-self:flex-end;max-height:85vh;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:32px;height:32px;background:#334155;color:#fff}.stat{display:flex;justify-content:space-between;padding:15px;margin:10px 0;background:#0008;border:1px solid var(--b);border-radius:12px}.stat strong{font-size:18px}.net{background:linear-gradient(135deg,#0077b6,var(--p))}.fleet{display:flex;justify-content:space-between;padding:10px;margin:7px 0;border:1px solid var(--b);border-radius:12px}.hide{display:none!important}.reportwrap{background:#fff;color:#000;padding:15px;overflow:auto}.report table{border-collapse:collapse;width:100%;min-width:650px;font-size:12px}.report th,.report td{border:1px solid #cbd5e1;padding:7px;color:#000}.report th{background:#f1f5f9}@media print{body{background:#fff;color:#000;overflow:visible}.app{max-width:none;height:auto}header,.nav,#income,#ledger,#expense,.reportbar{display:none!important}#report{display:block!important}.reportwrap{padding:0}.report table{width:100%;min-width:0}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo"><svg viewBox="0 0 32 32" width="27" height="27" fill="none" aria-label="FleetPulse logo"><circle cx="16" cy="16" r="14" stroke="var(--p)" stroke-width="2" stroke-dasharray="6 3" opacity=".6"/><path d="M4 16h6l3-5 5 10 3-5h7" stroke="var(--p)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 6px var(--p))"/><circle cx="16" cy="16" r="2.5" fill="#fff" stroke="var(--p)" stroke-width="1.5"/></svg></div><div><div class="title">Fleet<span>Pulse</span></div><div class="powered">Powered by: <b>CarHub-Iloilo</b></div></div></div><button class="summary" onclick="summary()">📊 SUMMARY</button></header><div class="nav"><div class="tabs"><button id="ti" class="tab i" onclick="tab('income')">📥 INCOME</button><button id="tl" class="tab active" onclick="tab('ledger')">📖 LEDGER</button><button id="te" class="tab e" onclick="tab('expense')">📤 EXPENSE</button></div></div>
<section id="income" class="view"><div class="grid"><div><label>Date</label><input id="id" type="date"></div><div><label>Ref #</label><input id="ir" readonly></div><div class="full"><label>Unit Rented</label><select id="iu"></select></div><div class="full"><label>Client Name</label><input id="ic" placeholder="e.g. Juan Dela Cruz"></div><div class="full"><label>Amount Received (₱)</label><input id="ia" type="number" step=".01"></div><button id="is" class="btn green full" onclick="saveTx('Income')">💾 Save Income</button><button id="ix" class="btn gray full hide" onclick="reset()">❌ Cancel Edit</button></div></section>
<section id="ledger" class="view active"><div class="toolbar"><input id="q" placeholder="🔍 Search..." oninput="render()"><select id="mo" onchange="render()"><option value="ALL">🗓️ Month</option></select><select id="uf" onchange="render()"><option value="ALL">🚘 All Units</option></select></div><button class="print" onclick="report()">🖨️ Print / PDF Statement</button><div id="list"></div><div class="footer"><button class="link danger" onclick="wipe()">🗑️ Clear All App Data</button><button class="link" onclick="fleet()">⚙️ Units</button></div></section>
<section id="expense" class="view"><div class="grid"><div><label>Date</label><input id="ed" type="date"></div><div><label>Ref #</label><input id="er" readonly></div><div class="full"><label>Category</label><select id="ec"><option value="">Select Type...</option><option>Carwash</option><option>Driver Fare</option><option>Driver Salary</option><option>Fuel</option><option>Change Oil</option><option>Maintenance</option><option>Misc</option></select></div><div class="full"><label>Applied To Unit</label><select id="eu"></select></div><div class="full"><label>Details / Notes</label><input id="en" placeholder="e.g. Wash & Vacuum"></div><div class="full"><label>Amount Spent (₱)</label><input id="ea" type="number" step=".01"></div><button id="es" class="btn red full" onclick="saveTx('Expense')">💾 Record Expense</button><button id="ex" class="btn gray full hide" onclick="reset()">❌ Cancel Edit</button></div></section>
<section id="report" class="view"><div class="reportbar" style="display:flex;gap:8px;margin-bottom:10px"><button class="print" onclick="tab('ledger')">← Back to App</button><button class="print" onclick="window.print()">🖨️ Print Document</button></div><div class="reportwrap report"><h2 style="color:#0077b6;text-align:center">FleetPulse - CarHub-Iloilo Ledger</h2><p style="text-align:center;color:#64748b">Official Transaction History Statement</p><table><thead><tr><th>Date</th><th>Ref #</th><th>Type</th><th>Category/Unit</th><th>Details</th><th>Amount</th><th>Ending Balance</th></tr></thead><tbody id="rb"></tbody></table></div></section></div>
<div id="sum" class="overlay" onclick="if(event.target===this)this.style.display='none'"><div class="modal"><div class="head"><h2>Liquidation Summary</h2><button class="close" onclick="this.closest('.overlay').style.display='none'">✕</button></div><div class="stat"><span>Total Payments</span><strong class="pos" id="si">₱0.00</strong></div><div class="stat"><span>Total Expenses</span><strong class="neg" id="se">₱0.00</strong></div><div class="stat net"><span>Net Profit Balance</span><strong id="sb">₱0.00</strong></div></div></div>
<div id="fm" class="overlay" onclick="if(event.target===this)this.style.display='none'"><div class="sheet"><div class="head"><h2>Fleet Unit Manager</h2><button class="close" onclick="this.closest('.overlay').style.display='none'">✕</button></div><div id="fl"></div><hr><label>Add New Fleet Unit</label><input id="nn" placeholder="e.g. Innova Black"><select id="nc"><option>SEDAN</option><option>MPV</option><option>SUV</option><option>PICK-UP</option><option>VAN</option></select><button class="btn green" onclick="addUnit()">+ Add Unit to Fleet</button></div></div>
<script>
const K='fleetpulse-tx',F='fleetpulse-fleet',D=[['Vios Blue','SEDAN'],['Vios Maroon','SEDAN'],['Mirage G4 Red','SEDAN'],['Avanza Red','MPV'],['Xpander White','MPV'],['Fortuner Silver','SUV'],['Triton Gray','PICK-UP'],['Hiace White','VAN']];let tx=JSON.parse(localStorage.getItem(K)||'[]'),fs=JSON.parse(localStorage.getItem(F)||'null')||D.map(x=>({name:x[0],cat:x[1]})),eid=null,$=x=>document.getElementById(x),money=x=>'₱'+Number(x||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(K,JSON.stringify(tx));localStorage.setItem(F,JSON.stringify(fs))}function today(){return new Date().toISOString().slice(0,10)}function ref(t){return(t==='Income'?'PAY-':'EXP-')+Math.floor(1000+Math.random()*9000)}
function populate(){['iu','eu'].forEach(id=>{let s=$(id),old=s.value;s.innerHTML=id==='eu'?'<option value="N/A">N/A (General Expense)</option>':'<option value="">Select Unit...</option>';['SEDAN','MPV','SUV','PICK-UP','VAN'].forEach(c=>{let a=fs.filter(x=>x.cat===c);if(a.length){let g=document.createElement('optgroup');g.label=c;a.forEach(u=>{let o=document.createElement('option');o.value=u.name;o.textContent=u.name;g.appendChild(o)});s.appendChild(g)}});if(old)s.value=old});let m=[...new Set(tx.map(x=>x.date.slice(0,7)))].sort().reverse();$('mo').innerHTML='<option value="ALL">🗓️ Month</option>'+m.map(x=>`<option>${x}</option>`).join('');let u=[...new Set(fs.map(x=>x.name))].sort();$('uf').innerHTML='<option value="ALL">🚘 All Units</option>'+u.map(x=>`<option>${esc(x)}</option>`).join('')}
function reset(){eid=null;$('id').value=$('ed').value=today();$('ir').value=ref('Income');$('er').value=ref('Expense');$('iu').value='';$('eu').value='N/A';$('ic').value=$('ia').value='';$('ec').value='';$('en').value=$('ea').value='';$('is').textContent='💾 Save Income';$('es').textContent='💾 Record Expense';$('ix').classList.add('hide');$('ex').classList.add('hide')}
function saveTx(t){let i=t==='Income',d=$(i?'id':'ed').value,u=$(i?'iu':'eu').value,a=+$(i?'ia':'ea').value;if(!d||!u||!a||a<=0)return alert('Please complete the required fields.');if(!i&&!$('ec').value)return alert('Select an expense category.');let x={id:eid||Date.now()+Math.random(),type:t,date:d,sn:$(i?'ir':'er').value,unit:u,amount:a,client:i?($('ic').value.trim()||'Walk-in'):'',category:i?'':$('ec').value,notes:i?'':($('en').value.trim()||'N/A')};tx=eid?tx.map(z=>z.id===eid?x:z):[...tx,x];save();populate();render();reset();tab('ledger')}
function expenseIcon(cat){const icons={Carwash:{p:"M256 32C178.6 128.5 64 246.3 64 336c0 106 86 192 192 192s192-86 192-192C448 246.3 333.4 128.5 256 32z",c:"#00b4d8"},Fuel:{p:"M320 32c0-17.7-14.3-32-32-32H160c-17.7 0-32 14.3-32 32v32H96c-35.3 0-64 28.7-64 64v320c0 35.3 28.7 64 64 64h224c35.3 0 64-28.7 64-64V128c0-35.3-28.7-64-64-64h-32V32zM288 160H160V96h128v64z",c:"#ef4444"},"Driver Fare":{p:"M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-96 64C57.3 320 0 377.3 0 448v32c0 17.7 14.3 32 32 32h384c17.7 0 32-14.3 32-32v-32c0-70.7-57.3-128-128-128H128z",c:"#ef4444"},"Driver Salary":{p:"M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-96 64C57.3 320 0 377.3 0 448v32c0 17.7 14.3 32 32 32h384c17.7 0 32-14.3 32-32v-32c0-70.7-57.3-128-128-128H128z",c:"#ef4444"},"Change Oil":{p:"M502.6 137.9c12.5-12.5 12.5-32.8 0-45.3l-55.8-55.8c-12.5-12.5-32.8-12.5-45.3 0L352.7 82.7l101.1 101.1 48.8-45.9zM195.9 238.5L344.4 90 422 167.5 273.5 316.1l-61.9 19.3-15.7-15.7 19.3-61.2zM32 384c0 35.3 28.7 64 64 64h320c17.7 0 32-14.3 32-32s-14.3-32-32-32H96c-35.3 0-64 28.7-64 64z",c:"#ef4444"},Maintenance:{p:"M502.6 137.9c12.5-12.5 12.5-32.8 0-45.3l-55.8-55.8c-12.5-12.5-32.8-12.5-45.3 0L352.7 82.7l101.1 101.1 48.8-45.9zM195.9 238.5L344.4 90 422 167.5 273.5 316.1l-61.9 19.3-15.7-15.7 19.3-61.2zM32 384c0 35.3 28.7 64 64 64h320c17.7 0 32-14.3 32-32s-14.3-32-32-32H96c-35.3 0-64 28.7-64 64z",c:"#ef4444"},Misc:{p:"M256 32C132.3 32 32 132.3 32 256s100.3 224 224 224 224-100.3 224-224S379.7 32 256 32zm0 352a128 128 0 1 1 0-256 128 128 0 0 1 0 256z",c:"#94a3b8"}};const i=icons[cat]||icons.Misc;return `<svg viewBox="0 0 512 512" width="21" height="21" fill="${i.c}" aria-hidden="true"><path d="${i.p}"/></svg>`}
function render(){let a=[...tx].sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id),b=0;a=a.map(x=>(b+=x.type==='Income'?x.amount:-x.amount,{...x,bal:b}));let q=$('q').value.toLowerCase(),m=$('mo').value,u=$('uf').value;a=a.filter(x=>(m==='ALL'||x.date.slice(0,7)===m)&&(u==='ALL'||x.unit===u)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));let inc=a.filter(x=>x.type==='Income').reduce((s,x)=>s+x.amount,0),exp=a.filter(x=>x.type==='Expense').reduce((s,x)=>s+x.amount,0);$('si').textContent=money(inc);$('se').textContent=money(exp);$('sb').textContent=money(inc-exp);$('list').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="card" style="border-left-color:${x.type==='Income'?'#10b981':'#ef4444'}"><div class="icon">${x.type==='Income'?'<svg viewBox=\"0 0 512 512\" width=\"21\" height=\"21\" fill=\"#00b4d8\"><path d=\"M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V400v48c0 17.7-14.3 32-32 32H448c-17.7 0-32-14.3-32-32V400H96v48c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32V400 256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z\"/></svg>':expenseIcon(x.category)}</div><div class="info"><div class="ct">${esc(x.type==='Income'?x.unit:x.category)}</div><div class="ref">Ref: #${esc(x.sn)}</div><div class="sub">${esc(x.date)} • ${esc(x.type==='Income'?x.client:x.unit+' | '+x.notes)}</div><div class="acts"><button class="mini" onclick="edit(${x.id})">✏️</button><button class="mini" onclick="del(${x.id})">🗑️</button></div></div><div class="amt ${x.type==='Income'?'pos':'neg'}">${x.type==='Income'?'+':'-'}${money(x.amount)}<div class="bal">Bal: ${money(x.bal)}</div></div></div>`).join(''):'<div style="text-align:center;padding:60px 20px;color:#94a3b8">No records match your filters.</div>';return a}
function edit(id){let x=tx.find(z=>z.id===id);if(!x)return;eid=id;if(x.type==='Income'){$('id').value=x.date;$('ir').value=x.sn;$('iu').value=x.unit;$('ic').value=x.client;$('ia').value=x.amount;$('is').textContent='💾 Update Income';$('ix').classList.remove('hide');tab('income')}else{$('ed').value=x.date;$('er').value=x.sn;$('ec').value=x.category;$('eu').value=x.unit;$('en').value=x.notes;$('ea').value=x.amount;$('es').textContent='💾 Update Expense';$('ex').classList.remove('hide');tab('expense')}}function del(id){if(confirm('Delete this transaction?')){tx=tx.filter(x=>x.id!==id);save();populate();render()}}function wipe(){if(confirm('Erase all records from this device?')){tx=[];save();render()}}
function tab(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));({income:'ti',ledger:'tl',expense:'te'}[id]&&$({income:'ti',ledger:'tl',expense:'te'}[id]).classList.add('active'))}function summary(){$('sum').style.display='flex';render()}function fleet(){$('fm').style.display='flex';renderFleet()}function renderFleet(){$('fl').innerHTML=fs.map((x,i)=>`<div class="fleet"><b>${esc(x.name)}</b><span>${esc(x.cat)} <button class="mini" onclick="removeUnit(${i})">🗑️</button></span></div>`).join('')}function addUnit(){let n=$('nn').value.trim(),c=$('nc').value;if(!n)return alert('Enter a unit name.');if(fs.some(x=>x.name.toLowerCase()===n.toLowerCase()))return alert('Unit already exists.');fs.push({name:n,cat:c});$('nn').value='';save();populate();renderFleet()}function removeUnit(i){if(fs.length<=1)return alert('Keep at least one unit.');fs.splice(i,1);save();populate();renderFleet()}
function report(){let a=render();if(!a.length)return alert('No transactions to print.');$('rb').innerHTML=a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.sn)}</td><td>${x.type==='Income'?'INC':'EXP'}</td><td>${esc(x.type==='Income'?x.unit:x.category)}</td><td>${esc(x.type==='Income'?x.client:x.unit+' - '+x.notes)}</td><td>${x.type==='Income'?'+':'-'}${money(x.amount)}</td><td>${money(x.bal)}</td></tr>`).join('');tab('report')}
populate();reset();render();
</script></body></html>
